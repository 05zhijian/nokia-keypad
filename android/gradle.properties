org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Gradle 默认的 HTTP 超时偏短。这台机器上拉 maven 偶尔会中途卡住，一卡就整个
# 构建报废——而且是在跑了十几分钟之后才报 "error while downloading artifacts
# from the network"，前面的时间全白费。拉长超时并允许重试。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
